[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devclean"
version = "0.1.0"
description = "Clean development junk folders from your repos"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["cli", "developer-tools", "cleanup", "node_modules", "venv", "__pycache__", ".pytest_cache", ".mypy_cache", "dist", "build"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
devclean = "devclean.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devclean"]

[tool.pytest.ini_options]
testpaths = ["tests"]